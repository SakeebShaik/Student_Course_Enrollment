<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Student Course Management</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/common.js"></script>
</head>
<body>

<header class="navbar">
    <a href="index.html" class="brand-logo">
        <div class="brand-icon">📚</div>
        <span>CourseManager</span>
    </a>

    <div class="nav-actions">
        <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode" aria-label="Toggle theme">
            🌙
        </button>
        <a href="register.html" class="btn btn-secondary btn-sm">Register</a>
    </div>
</header>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Sign In</h1>
            <p class="auth-subtitle">Enter your credentials to access your dashboard</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div style="position: relative;">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Password"
                        required
                        autocomplete="current-password"
                        style="padding-right: 2.5rem;"
                    >
                    <button
                        type="button"
                        onclick="togglePassword()"
                        style="position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1rem;"
                        title="Show/Hide Password"
                    >
                        <span id="togglePasswordIcon">👁️</span>
                    </button>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.7rem;">
                Sign In
            </button>
        </form>

        <div id="message" style="margin-top: 1rem; text-align: center;"></div>

        <div class="auth-footer">
            <p>
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>
        </div>
    </div>
</div>

<footer class="footer">
    <p>© 2026 Student Course Management System</p>
</footer>

<script src="js/login.js"></script>

</body>
</html>
